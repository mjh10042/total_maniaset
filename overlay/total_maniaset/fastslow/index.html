<!doctype html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>fastslow</title>
  <link rel="stylesheet" href="../shared/tm-style.css" />
  <script src="../shared/tm-core.js"></script>
  <script src="../shared/tm-hiterror.js"></script><!-- TM.timingWindows: a press outside the 50 window is a miss -->
  <script src="../shared/tm-fastslow.js"></script>
</head>

<body>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (TM.isStandalonePreview) document.body.classList.add('tm-preview');
      const fastslow = new TM.FastSlow(document.body);
      TM.instances = { fastslow }; // handy from the devtools console
      TM.settings(TM.FASTSLOW_DEFAULTS, (s) => fastslow.applySettings(s));
      TM.v2((d) => fastslow.onV2(d), TM.FASTSLOW_V2_FILTERS);
      TM.precise((d) => fastslow.onPrecise(d), TM.FASTSLOW_PRECISE_FILTERS);
    });
  </script>
</body>

</html>
